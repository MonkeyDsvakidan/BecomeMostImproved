<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background:
					radial-gradient(circle at top, rgba(255, 140, 0, 0.18), transparent 38%),
					linear-gradient(180deg, #111111 0%, #1a1a1a 50%, #121212 100%);
				color: #f5f5f5;
				color-scheme: dark;
			}

			body {
				min-height: 100vh;
			}

			#svelte {
				min-height: 100vh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body class="bg-dark text-light" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
