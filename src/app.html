<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>BecomeMostImproved</title>
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/icon.svg" as="image" />
		<!-- Ensure Bootstrap picks up our secondary color by defining variables before CSS loads -->
		<style>
			:root {
				--bs-secondary: #ff964f;
				--bs-secondary-color: #ff964f;
				--bs-secondary-rgb: 255, 150, 79;
			}
		</style>
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background:
					radial-gradient(circle at top, rgba(255, 140, 0, 0.18), transparent 38%),
					linear-gradient(180deg, #111111 0%, #1a1a1a 50%, #121212 100%);
				color: #f5f5f5;
				color-scheme: dark;
			}

			body {
				min-height: 100vh;
			}

			#svelte {
				min-height: 100vh;
			}
		</style>
		%sveltekit.head%
	</head>
	<body class="bg-dark text-light" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
